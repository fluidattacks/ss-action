name: 'Fluid Attacks SS'
description: 'Find leaked secrets with Fluid Attacks scanner'
author: 'Fluid Attacks'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  scan_config_path:
    description: >
      Path to the YAML configuration file, relative to the repository root.
      When not provided, the action runs with built-in defaults.
      The job fails if the file does not exist at the given path.
    required: false
    default: ''
  scanner_mode:
    description: >
      Scan mode. "full" (default) scans the entire repository on every run.
      "diff" scans only changed files versus the base branch or PR base —
      requires fetch-depth: 0 in the checkout step.
    required: false
    default: ''
  group:
    description: >
      Fluid Attacks group to authenticate the scan as (passed as --group).
      Required only for OpenID Connect; not needed with "api_token", which
      already identifies the group. With OpenID Connect, grant the job
      "permissions: id-token: write" and define a trust for the repository.
      When empty, or when credentials are unavailable, the scan runs
      unauthenticated.
    required: false
    default: ''
  api_token:
    description: >
      Long-lived Group token, used when OIDC is not an option. Pass it from a
      secret. Takes precedence over OIDC. Does not require the "group" input.
    required: false
    default: ''

outputs:
  sarif_file:
    description: 'Path to SARIF results file (if SARIF format selected)'
    value: ${{ steps.scan.outputs.sarif_file }}
  vulnerabilities_found:
    description: 'Whether vulnerabilities were found (true/false)'
    value: ${{ steps.scan.outputs.vulnerabilities_found }}

runs:
  using: 'composite'
  steps:
    - name: Resolve config and mode
      id: resolve
      shell: bash
      run: bash "${{ github.action_path }}/resolve-mode.sh"
      env:
        SCAN_CONFIG_PATH: ${{ inputs.scan_config_path }}
        SCANNER_MODE: ${{ inputs.scanner_mode }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_BEFORE: ${{ github.event.before }}

    - name: Get changed files
      if: steps.resolve.outputs.mode == 'diff'
      id: changed
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        base_sha: ${{ steps.resolve.outputs.base_sha }}
        separator: "\n"

    - name: Install ss
      shell: bash
      run: bash "${{ github.action_path }}/install-ss.sh"

    - name: Run scan
      id: scan
      shell: bash
      run: |
        echo "Current branch: ${CURRENT_BRANCH}"
        bash "${{ github.action_path }}/generate-config.sh"
      env:
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        INPUT_MODE: ${{ steps.resolve.outputs.mode }}
        CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        USER_CONFIG_FILE: ${{ steps.resolve.outputs.config_file }}
        FLUID_GROUP: ${{ inputs.group }}
        INTEGRATES_API_TOKEN: ${{ inputs.api_token }}
